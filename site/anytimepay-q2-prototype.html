  <script>
    (function () {
      var root = document.getElementById('ap-q2-prototype');
      var main = root.querySelector('#ap-main');
      var overlay = root.querySelector('#ap-overlay');
      var scenarioSelect = root.querySelector('#ap-scenario');
      var state = { scenario: 'first', entitled: false, available: 143, outstanding: 40, ytd: 385, checking: 805.42, transferDone: false, view: 'home', tab: 'details', flash: false };
      var labels = ['Updating account activity', 'Confirming earnings information', 'Calculating available earnings', 'Preparing your AnyTimePay account'];

      function money(value) { return '$' + Number(value).toFixed(2); }
      function accountBalanceMarkup(value) {
        var amount = Number(value).toFixed(2).split('.');
        return '$' + Number(amount[0]).toLocaleString('en-US') + '<sup>' + amount[1] + '</sup>';
      }
      function repaymentDate() {
        var date = new Date();
        var fridayCount = 0;
        while (fridayCount < 2) {
          date.setDate(date.getDate() + 1);
          if (date.getDay() === 5) fridayCount += 1;
        }
        return date.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
      }
      function brandMarkup(page) {
        return '<div class="' + (page ? 'page-brand ' : '') + 'ap-brand"><svg viewBox="0 0 48 42" aria-hidden="true"><path d="M5 33 C12 39 22 34 29 26 C35 20 40 21 44 25" fill="none" stroke="#22b95e" stroke-width="6" stroke-linecap="round"/><path d="M8 28 L22 6 L31 24" fill="none" stroke="#22b95e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M39 20 L45 25 L38 30" fill="none" stroke="#22b95e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg><div><div class="ap-brand-text">AnyTime<em>Pay</em></div>' + (page ? '<div class="ap-tagline">Access your pay, anytime.</div>' : '') + '</div></div>';
      }

      function home() {
        var active = state.entitled || ['returning', 'halted', 'nudge-after'].indexOf(state.scenario) >= 0;
        var anyTimeBody = active
          ? '<div class="balance">' + money(state.available) + '</div><div class="balance-label">AVAILABLE EARNINGS</div><button class="link-button" data-action="open-anytime">View details &amp; transfer</button>'
          : '<p>Access your eligible earnings before payday.</p><button class="primary" data-action="open-anytime">Get started</button>';
        state.view = 'home';
        main.innerHTML = '<div class="dashboard"><section class="panel" aria-label="Accounts"><h2>ACCOUNTS</h2>' +
          '<div class="account-row"><div class="account-title">CHECKING</div><div class="balance">' + accountBalanceMarkup(state.checking) + '</div><div class="balance-label">AVAILABLE BALANCE</div></div>' +
          '<div class="account-row"><div class="account-title">SAVINGS</div><div class="balance">$2,135<sup>03</sup></div><div class="balance-label">AVAILABLE BALANCE</div></div>' +
          '<div class="anytime-row">' + brandMarkup(false) + '<span class="tag">EARNED PAY</span>' + anyTimeBody + '</div></section>' +
          '<section class="panel" aria-label="Services"><h2>SERVICES</h2><div class="service-card"><div><h3>Transfer funds</h3><p>Move money between your AltaOne accounts.</p></div><button class="secondary">Transfer</button></div></section></div>';
      }

      function account(tab) {
        tab = tab || 'details';
        state.view = 'account';
        state.tab = tab;
        main.innerHTML = '<button class="back" data-action="home">&larr; Back</button><div class="page-head"><div>' + brandMarkup(true) +
          '<div class="updated">Last updated: August 6, 2026 9:18 AM</div></div><div class="head-balance"><strong>' + money(state.available) + '</strong><span>Available Earnings</span><button class="primary" data-action="transfer">Transfer earnings</button></div></div>' +
          '<div class="tabs"><button class="tab ' + (tab === 'transactions' ? 'active' : '') + '" data-action="transactions">Transactions</button>' +
          '<button class="tab ' + (tab === 'details' ? 'active' : '') + '" data-action="details">Details &amp; Settings</button></div>' +
          '<section class="account-content">' + (tab === 'transactions' ? transactionsMarkup() : detailsMarkup()) + '</section>';
      }

      function detailsMarkup() {
        return '<div class="wellness-grid"><div class="wellness-card outlook"><div class="score-ring"><div class="score-number">67</div></div>' +
          '<div><h3>Cash-to-Payday Outlook: Watch closely</h3><p>How likely your available cash is to last until your next expected payday.</p><span class="not-credit">This is a financial wellness indicator&mdash;not a credit score.</span><br><button class="link-button">View score details</button></div></div>' +
          '<div class="wellness-card nudge-card"><svg class="nudge-path" viewBox="0 0 300 180" preserveAspectRatio="none" aria-hidden="true"><path d="M0 132 C42 89 64 166 94 180" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="7 7"/><path d="M232 0 C271 45 255 97 300 71" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="7 7"/></svg>' +
          '<h3>Financial Wellness</h3><p>Simple &amp; personalized financial education to help you stay on track.</p><small>powered by nudge</small><button class="primary" data-action="open-nudge">Explore Nudge</button></div></div>' +
          '<div class="faq-row"><span class="faq-icon">?</span><span>Have any questions? <a href="#" data-action="faq">Visit our FAQs</a></span></div>' +
          '<div class="detail-grid"><div class="metric"><label>Available Earnings</label><span>' + money(state.available) + '</span></div><div class="metric"><label>Current Outstanding Amount</label><span>' + money(state.outstanding) + '</span></div>' +
          '<div class="metric"><label>Year-to-Date Accessed</label><span>' + money(state.ytd) + '</span></div><div class="metric"><label>Expected Repayment</label><span>' + repaymentDate() + '</span></div>' +
          '<div class="metric"><label>Current Pay Cycle</label><span>Earnings are updating each day until payday.</span></div><div class="metric"><label>Payroll Connection</label><span>Connected</span></div></div>';
      }

      function transactionsMarkup() {
        var banner = state.flash ? '<div class="success-banner"><b>&#10003;</b><span>$60.00 transferred to Checking. The $4.99 fee will be assessed on ' + repaymentDate() + '.</span><button class="banner-close" data-action="dismiss-banner" aria-label="Dismiss repayment message">&times;</button></div>' : '';
        return banner + '<table aria-label="AnyTimePay transactions"><thead><tr><th>Date</th><th>Description</th><th>Amount</th></tr></thead><tbody>' +
          '<tr><td>Aug 6, 2026</td><td>AnyTimePay transfer to Checking &bull;&bull;&bull;&bull;0090</td><td class="debit">&minus; $60.00</td></tr>' +
          '<tr><td>Jul 31, 2026</td><td>AnyTimePay repayment</td><td class="credit">+ $40.00</td></tr>' +
          '<tr><td>Jul 29, 2026</td><td>AnyTimePay transfer to Checking &bull;&bull;&bull;&bull;0090</td><td class="debit">&minus; $40.00</td></tr></tbody></table>';
      }

      function nudge() {
        state.view = 'nudge';
        main.innerHTML = '<button class="back" data-action="home">&larr; Back</button><section class="panel nudge"><div class="nudge-mark">&#10022;</div><h1>Financial Wellness</h1>' +
          '<p>Personalized guidance to help you build stronger everyday financial habits.</p><div class="nudge-tools"><div><strong>Learn</strong><span>Short, relevant financial lessons.</span></div><div><strong>Plan</strong><span>Turn goals into practical next steps.</span></div><div><strong>Track</strong><span>Build habits that support your goals.</span></div></div><button class="primary">Open Nudge</button><p class="not-credit">Powered by Nudge</p></section>';
      }

      function progressMarkup(current, haltAt) {
        var halted = haltAt && current === haltAt;
        var steps = labels.map(function (label, index) {
          var n = index + 1;
          var cls = n < current ? 'done' : (n === current ? (halted ? 'halted' : 'active') : '');
          var mark = n < current ? '&#10003;' : (halted && n === current ? '!' : n);
          return '<li class="step ' + cls + '"><span class="step-mark">' + mark + '</span><span>' + n + ' of 4 &mdash; ' + label + '</span></li>';
        }).join('');
        var support = halted ? '<div class="support-box"><strong>We couldn&#39;t complete your earnings check.</strong>Contact Member Support and reference <b>AP-48291</b>.<br><small>August 6, 2026 at 9:18 AM</small></div><div class="modal-actions"><button class="secondary" data-action="close-modal">Close</button></div>' : '';
        return '<div class="overlay"><section class="modal" role="dialog" aria-modal="true"><h2>Checking your AnyTimePay availability</h2><p>This usually takes only a few moments.</p><ol class="steps">' + steps + '</ol>' + support + '</section></div>';
      }

      function progress(haltAt, fast) {
        var current = 1;
        var wait = fast ? 260 : 850;
        haltAt = haltAt || 0;
        function draw() {
          var halted = haltAt && current === haltAt;
          overlay.innerHTML = progressMarkup(current, haltAt);
          if (halted) return;
          if (current < 4) setTimeout(function () { current += 1; draw(); }, wait);
          else setTimeout(function () { state.entitled = true; overlay.innerHTML = ''; account('details'); }, wait);
        }
        draw();
      }

      function staticProgress(current, haltAt) { overlay.innerHTML = progressMarkup(current || 1, haltAt || 0); }
      function transfer() {
        overlay.innerHTML = '<div class="overlay"><section class="modal" role="dialog" aria-modal="true"><h2>Transfer from AnyTimePay</h2><p>Move available earnings into an AltaOne account.</p><div class="transfer-grid">' +
          '<div class="field"><label>From</label><select><option>AnyTimePay &mdash; ' + money(state.available) + ' available</option></select></div><div class="field"><label>To</label><select><option>Checking &bull;&bull;&bull;&bull;0090</option><option>Savings &bull;&bull;&bull;&bull;0001</option></select></div>' +
          '<div class="field"><label>Amount</label><input id="ap-amount" type="text" value="$60.00"></div><div class="field"><label>Delivery</label><input type="text" value="Immediately" disabled></div></div>' +
          '<div class="modal-actions"><button class="secondary" data-action="close-modal">Cancel</button><button class="primary" data-action="review-transfer">Review transfer</button></div></section></div>';
      }

      function reviewTransfer(accepted) {
        var checked = accepted ? 'checked' : '';
        var disabled = accepted ? '' : 'disabled';
        overlay.innerHTML = '<div class="overlay"><section class="modal" role="dialog" aria-modal="true"><h2>Review AnyTimePay transfer</h2><p>Confirm the amount, fee and repayment before transferring.</p>' +
          '<div class="review-lines"><div class="review-line"><span>Amount delivered</span><b>$60.00</b></div><div class="review-line"><span>Transaction fee</span><b>$4.99</b></div><div class="review-line total"><span>Total repayment</span><b>$64.99</b></div><div class="review-line repayment-date"><span>Repayment date</span><b>' + repaymentDate() + '</b></div></div>' +
          '<label class="terms-check" for="ap-terms"><input id="ap-terms" type="checkbox" ' + checked + '><span>I have reviewed and agree to the <a href="#" data-action="terms">AnyTimePay Terms &amp; Conditions</a> and <a href="#" data-action="fee-disclosure">Fee Disclosure</a>.</span></label>' +
          '<div class="modal-actions"><button class="secondary" data-action="transfer">Back</button><button class="primary" id="ap-submit-transfer" data-action="submit-transfer" ' + disabled + '>Accept and transfer $60.00</button></div></section></div>';
      }

      function submitTransfer() {
        if (!state.transferDone) state.checking += 60;
        state.available = 83; state.outstanding = 104.99; state.ytd = 445; state.entitled = true; state.flash = true; state.transferDone = true;
        overlay.innerHTML = '';
        account('transactions');
      }

      function openAnyTimePay() {
        if (state.scenario === 'first' && !state.entitled) {
          overlay.innerHTML = '<div class="overlay"><section class="modal" role="dialog" aria-modal="true"><div class="page-brand">' + brandMarkup(true) + '</div><h2>Access your eligible earnings before payday</h2>' +
            '<p>Access your pay, anytime. AnyTimePay lets you move available earnings into your AltaOne account when you need them.</p><div class="modal-actions"><button class="secondary" data-action="close-modal">Not now</button><button class="primary" data-action="start-check">Check my available earnings</button></div></section></div>';
        } else if (state.scenario === 'halted') progress(2, false);
        else if (state.scenario === 'returning') progress(0, false);
        else account('details');
      }

      root.addEventListener('click', function (event) {
        var actionNode = event.target.closest('[data-action]');
        if (!actionNode) return;
        var action = actionNode.getAttribute('data-action');
        if (event.target.closest('a')) event.preventDefault();
        if (action === 'home') home();
        else if (action === 'open-anytime') openAnyTimePay();
        else if (action === 'start-check') progress(0, false);
        else if (action === 'transactions') account('transactions');
        else if (action === 'details') account('details');
        else if (action === 'transfer') transfer();
        else if (action === 'review-transfer') reviewTransfer(false);
        else if (action === 'submit-transfer') submitTransfer(false);
        else if (action === 'open-nudge') nudge();
        else if (action === 'dismiss-banner') { state.flash = false; account('transactions'); }
        else if (action === 'close-modal') overlay.innerHTML = '';
      });

      root.addEventListener('change', function (event) {
        if (event.target.id === 'ap-terms') {
          var submit = root.querySelector('#ap-submit-transfer');
          if (submit) submit.disabled = !event.target.checked;
        }
      });

      scenarioSelect.addEventListener('change', function (event) {
        state.scenario = event.target.value; state.available = 143; state.outstanding = 40; state.ytd = 385; state.checking = 805.42; state.transferDone = false; state.flash = false;
        state.entitled = ['returning', 'halted', 'nudge-after'].indexOf(state.scenario) >= 0;
        overlay.innerHTML = '';
        if (state.scenario.indexOf('nudge') === 0) nudge(); else home();
      });

      window.apDemo = { home: home, account: account, nudge: nudge, progress: progress, staticProgress: staticProgress, transfer: transfer, reviewTransfer: reviewTransfer, submitTransfer: submitTransfer, state: state };
      home();
      var scene = new URLSearchParams(location.search).get('scene');
      var scenes = {
        'home-first': function () { state.entitled = false; state.scenario = 'first'; home(); },
        'welcome': function () { state.entitled = false; state.scenario = 'first'; home(); openAnyTimePay(); },
        'progress-1': function () { home(); staticProgress(1, 0); }, 'progress-2': function () { home(); staticProgress(2, 0); },
        'progress-3': function () { home(); staticProgress(3, 0); }, 'progress-4': function () { home(); staticProgress(4, 0); },
        'details': function () { state.entitled = true; account('details'); }, 'transfer': function () { state.entitled = true; account('details'); transfer(); },
        'review': function () { state.entitled = true; account('details'); reviewTransfer(true); }, 'success': function () { state.entitled = true; account('details'); submitTransfer(); },
        'transactions': function () { state.entitled = true; state.available = 83; account('transactions'); }, 'home-active': function () { state.entitled = true; home(); },
        'home-post-transfer': function () { state.entitled = true; state.available = 83; state.outstanding = 104.99; state.ytd = 445; state.checking = 865.42; state.transferDone = true; home(); },
        'returning-1': function () { state.entitled = true; home(); staticProgress(1, 0); }, 'returning-2': function () { state.entitled = true; home(); staticProgress(2, 0); },
        'returning-3': function () { state.entitled = true; home(); staticProgress(3, 0); }, 'returning-4': function () { state.entitled = true; home(); staticProgress(4, 0); },
        'halted': function () { state.entitled = true; home(); staticProgress(2, 2); }, 'nudge-after': function () { state.entitled = true; state.scenario = 'nudge-after'; nudge(); }
      };
      if (scene && scenes[scene]) scenes[scene]();
    }());
  </script>
</div>
